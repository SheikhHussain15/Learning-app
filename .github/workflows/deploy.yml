name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Run database migrations
        run: |
          cd app/backend
          pip install -r requirements.txt
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Build and deploy backend
        run: |
          docker build -t ai-learning-backend:staging -f app/backend/Dockerfile app/backend
          # Deploy to staging (replace with actual deployment command)
          echo "Deployed to staging"
      - name: Build and deploy frontend
        run: |
          cd app/frontend
          npm ci
          npm run build
          # Deploy to staging CDN (replace with actual deployment command)
          echo "Frontend deployed to staging"
      - name: Health check
        run: |
          sleep 30
          curl -f https://staging-api.example.com/api/v1/health || exit 1
      - name: Smoke tests
        run: |
          # Run basic smoke tests
          echo "Smoke tests passed"

  deploy-production:
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v7
      - name: Run database migrations
        run: |
          cd app/backend
          pip install -r requirements.txt
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Build and deploy backend
        run: |
          docker build -t ai-learning-backend:production -f app/backend/Dockerfile app/backend
          echo "Deployed to production"
      - name: Build and deploy frontend
        run: |
          cd app/frontend
          npm ci
          npm run build
          echo "Frontend deployed to production"
      - name: Health check
        run: |
          sleep 30
          curl -f https://api.example.com/api/v1/health || exit 1
      - name: Verify deployment
        run: |
          echo "Production deployment verified"
